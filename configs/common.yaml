# Shared defaults. Paper references: arXiv 2511.00091 (PLD), Table 5 / Alg. 1 / §3 / §4.5.
paths:
  runs_root: runs            # relative to repo root unless absolute
  data_root: runs/pld_data   # LeRobot datasets written by stage 2

env:
  camera_size: 256           # what both VLAs consume (RC365 gym-wrapper convention)
  obj_instance_split: pretrain
  horizon: null              # null -> robocasa get_task_horizon(task)  (T in the paper)
  num_envs: 4                # parallel env worker processes. Each RoboCasa env takes ~6.5 GB host RAM and some
                             # GPU memory for EGL rendering; 4 fits a 24 GB 4090 next to XR1 + the learner.
  mujoco_gl: egl
  # privileged: true appends 13 entries of privileged sim state (envs/rc365_env.py PRIV_STATE_ORDER) to the stored
  # proprio for an asymmetric critic (rl.critic_proprio). Left unset here so existing cache keys still match.
  # EGL rendering of a RoboCasa kitchen (3 cams) takes ~1.15 GB of GPU memory per env (measured on a 4090).
  # When a stage starts, num_envs is capped to what fits next to whatever is already on the GPU (the VLA server).
  cap_envs_by_gpu_mem: true
  gpu_mem_per_env_gb: 1.1
  gpu_mem_per_env_record_gb: 1.5  # envs that record episodes (stage 2): ~1.45 GB each measured on an RTX 4090
  gpu_mem_reserve_train_gb: 4.0   # residual learner (~1.5 GB) + growth of the VLA server under batched inference
                                  # (~2 GB); 9 envs with a 2 GB reserve reached 24.0/24.5 GB on a 4090
  gpu_mem_reserve_eval_gb: 0.5

probing:
  alpha: 0.8                 # T_base ~ U[0, alpha*T]   (user choice; paper plateau at 0.6)
  # T = task horizon (paper-literal, user choice)

residual:
  dims: 7                    # eef dpos(3) + drot(3) + gripper(1); base/torso/mode pass through
  xi: 0.1                    # residual magnitude bound. Paper: 0.5 for LIBERO, 0.1 for SimplerEnv (B.2, Fig. 13);
                             # 0.1 is one of the paper's own values.
                             # RoboCasa VLA steps are small (|a| ~0.1-0.2 position, 0.03-0.08 rotation; RC365 demo
                             # std 0.32-0.37 / 0.09-0.10). With a linear ramp to 0.5 the learned residual was 2-4x the
                             # VLA action on position and 4-10x on rotation, 36-57% at the bound, and takeover SR fell
                             # from a 0.62 base-only baseline to 0.14 (XR1 x CoffeeSetupMug, first run). Chosen: 0.1.
  xi_scale: [1, 1, 1, 0.3, 0.3, 0.3, 0]
                             # per-dim multipliers of xi (dx dy dz, rx ry rz, gripper), 0 = residual off on that dim.
                             # Since 2026-11-27 (user: paper setup, plus the rotation bound of the h8rot03 run and
                             # the gripper residual off for now): position xi, rotation 0.3 xi, gripper the VLA's.
                             # null = one bound on all 7 dims (the paper's 7-DoF residual).
                             # 2026-11-23 .. 11-27 (user decision then): [1,1,1,0,0,0,0], the residual acted
                             # on the end-effector position only; end-effector rotation and gripper are the VLA's (the
                             # ENPIRE PLD runtime's experiments also learn 3-D position only). The mobile base, torso
                             # and control mode never had a residual.
                             # Specialists trained before that (A, B, C, c2, D, known-answer) used
                             # [1,1,1,0.25,0.25,0.25,1]: pass residual.xi_scale=[1,1,1,0.25,0.25,0.25,1] to run them.
                             # per-dimension multiplier of xi (dx dy dz, rx ry rz, gripper): rotation bound = 0.025.
                             # The VLA's rotation actions are ~4x smaller than its position actions here (|a| 0.03-0.04
                             # vs 0.11-0.18; RC365 demo std 0.09-0.10 vs 0.32-0.37), so one xi for all dims let the
                             # learned residual push rotation as hard as the VLA itself (per-episode mean push 0.025 =
                             # 70-90% of the VLA's rotation action vs ~20% for position; runs up to 2026-11-21, all 1).
                             # The paper does not say in which action space xi is defined; the unofficial
                             # implementation adds the residual in q01/q99-normalised action space, which has the
                             # same effect. null = same bound for every dim.
  proprio: [end_effector_position_relative, end_effector_rotation_relative]
                             # since 2026-11-27 (user): the ACTOR sees only the proprio of the dims its residual acts
                             # on (eef position + rotation); the critic sees all 16 (rl.critic_proprio).
                             # proprio components the residual actor (and, without rl.critic_proprio, the critic) see;
                             # null = all 16 entries
                             # (base_position 3, base_rotation 4, end_effector_position_relative 3,
                             # end_effector_rotation_relative 4, gripper_qpos 2; every run before 2026-11-24).
                             # [end_effector_position_relative] = only what the residual acts on (xi_scale: eef xyz).
                             # The base pose is constant within an episode but differs between seeds (y up to 0.8 m),
                             # and the raw quaternions flip sign (q and -q) within and between episodes.
                             # Buffers always store all 16; the selection happens in the encoder.
  base_dims: null            # entries of the 12-D base action a_b the residual ACTOR sees (paper: pi_delta(.|s, a_b));
                             # null = all 12 (every run before 2026-11-26). Env order: eef pos 0:3, eef rot 3:6,
                             # gripper 6, base motion 7:11, control mode 11. [0,1,2,3,4,5] = only the eef axes the
                             # residual acts on. The critic always sees all 12 (option B: Q(s, a_b, a_delta)).
  xi_schedule: constant      # constant | linear (paper: "tuned by a scheduler", form not given)
  xi_start: 0.1              # only for linear
  xi_ramp_steps: 50000       # only for linear: residual-acted online steps to reach xi
  image_size: 256            # residual actor/critic input. 256 = the rendered camera frame as it is (no resampling):
                             # ResNet-10 feature map 8x8 per camera. The paper gives no resolution. 128 (4x4 map, the
                             # frame downsampled 2x) was used for every run before 2026-11-21.
  cameras: [robot0_agentview_left, robot0_agentview_right, robot0_eye_in_hand]
                             # all three RoboCasa cameras (what the VLA sees). Runs before 2026-11-21 used left +
                             # eye_in_hand only (the paper's real-robot setup: one side view + one wrist camera).
  augment:                   # DrQ / SERL random-shift image augmentation for the learner (the paper does not mention
                             # it; SERL, ENPIRE and the unofficial implementation use it with pad 4).
    mode: online             # online (from 2026-11-27, as SERL / ENPIRE): the buffers keep the raw uint8 residual
                             # images and the learner draws a fresh shift of up to +-`pad` px for every sampled image
                             # (s and s' independently) at every update, then runs the frozen backbone on the batch.
                             # stored (runs 2026-11-21 .. 11-27): each stored frame keeps the features of `views`
                             # copies shifted once at collection time; the learner draws one per camera, so a state
                             # only ever appears in views^n_cam variants (64 with 4 views and 3 cameras).
    pad: 4
    views: 4                 # mode stored only (0 = no augmentation, all runs before 2026-11-21)
    encode_chunk: 128        # mode online: samples per backbone pass in the learner (bounds activation memory)

rl:                          # Table 5
  batch_size: 256
  buffer_capacity: 250000
  discount: 0.99
  lr: 3.0e-4
  grad_clip: 1.0
  reward_bias: 0.0
  warmup_episodes: 100
  critic_actor_ratio: 2
  otf_samples: 1             # on-the-fly ratio (1 = plain SAC backup)
  target_entropy_scale: 0.5  # target entropy = -act_dim * 0.5
  init_temperature: 1.0
  tau: 0.005
  num_q: 2
  hidden_dim: 256
  latent_dim: 256
  num_spatial_features: 8    # SERL SpatialLearnedEmbeddings
  encoder_dropout: 0.1       # dropout after the spatial embeddings, before the 256 bottleneck (SERL ResNet encoder and
                             # ENPIRE: 0.1). Active in learner updates only (the collector actor and the target critic
                             # run in eval mode). 0 for every run before 2026-11-27.
  critic_uses_a_b: false     # paper Eq. 2: critic Q(s, a_bar), a_b is an input of the actor only. true = Q(s, a_b, a_bar)
                             # (the first three XR1 runs; must be true to load their checkpoints)
  critic_action: residual    # total = Q(s, a_bar) (paper Eq. 2). residual = Q(s, a_b, a_delta): a_b is critic state, the action
                             # input is the applied residual / xi (base-only data has exactly 0). Deviates from the paper;
                             # default since 2026-11-27 (user: the critic takes a_b and the residual separately).
  critic_proprio: [base_position, base_rotation, end_effector_position_relative, end_effector_rotation_relative, gripper_qpos]
                             # the critic's proprio: all 16 state entries (user 2026-11-27), no privileged sim state
                             # (env.privileged off: no asymmetric critic). null = same selection as the actor.
  backup_entropy: false      # SERL default
  timeout_terminal: true     # time limit without success = failed episode, terminal for the critic (paper 2.1: "an
                             # episode terminates and resets on task success with a restricted time limit ... a reward
                             # r in {0,1} is assigned"). false = bootstrap at the time limit: failures then never give a
                             # zero target (all runs before 2026-11-21; Q stayed 0.4-0.6 while success fell to 0.1-0.3).
  residual_hold: 1           # env steps the residual is held fixed after each decision (1 = decide every step,
                             # as in the paper). > 1: one transition per block, reward summed, bootstrap gamma^steps.
  n_step: 1                  # residual decisions per TD backup (1 = the paper's 1-step TD, Eq. 2)
  utd: 1.0                   # (user 2026-11-27: 1; 2.0 from 11-21, but the h8* runs used 1.0 too)
                             # critic updates per stored online transition (async learner throttle). With
                             # critic_actor_ratio 2 this is 2 critic + 1 actor/temperature update per transition, the
                             # per-cycle pattern of the unofficial implementation (utd: 2). The paper gives no value
                             # (SERL's learner is asynchronous and unthrottled). 1.0 was used until 2026-11-21.
  prefetch_threads: 3        # background threads that sample batches and move them to the GPU (0 = sample in the
                             # learner thread, as before 2026-11-21; with 256x256 features the learner then
                             # reached only ~0.6 updates per stored transition)
  prefetch_depth: 2          # ready batches kept on the GPU (~100 MB each with 3 cameras at 256 px)
  actor_sync_every: 50       # learner steps between actor weight pushes to the collector
  max_learner_lag: 512       # collection pauses while the learner is > 512 updates behind utd * stored steps, so the
                             # update-to-data ratio holds with many envs (the h8* runs; 0 = never wait)
  offline_successes: 50      # n in Alg. 1
  calql:
    steps: 20000
    alpha: 1.0          # CQL weight. Paper: critic "initialized by a conservative objective such as Cal-QL"; Fig. 14
                        # compares alpha in {0.0, 0.5, 1.0} ("robust to the conservative coefficients").
                        # alpha=0.0 was tried first (best Q(data)-vs-MC calibration: corr 0.95) but on XR1 x
                        # CoffeeSetupMug the actor then learned a state-independent residual along the VLA's
                        # near-success motion (arm retreat: offline corr(a_z, MC) = +0.60): in offline/warm-up data
                        # a_bar == a_b, so the unconstrained critic credits the action input with the progress signal.
                        # Takeover SR fell 0.68 -> 0.12 (baseline 0.58). The conservative term penalises exactly these
                        # out-of-data actions (alpha=1.0: Q(random residual) ~ -11 after pre-training).
    form: paper         # paper: PLD App. B.1 as written -- alpha*(E_{a~pi}[max(Q(s,a), V^mu(s))] - Q(s,a_data)) + 1/2 TD^2,
                        #        policy actions only, floored at the MC return.
                        # cqlh : the Cal-QL code base's CQL(H) (log-sum-exp over uniform random + policy actions). Used
                        #        by the first runs: Q(random) fell to -30 (no floor), Q(data) oscillated (-1.7..+1.0).
    num_samples: 10     # policy-action samples per state
    random: full        # cqlh only. full: U[-1,1]^d | residual: a_b + U[-xi,xi]^d
  device: cuda:0

stage1:
  # Offline buffer (n base successes) is always saved to runs/<model>/<task>/offline_cache/<key>/ after collection.
  # reuse_offline: true -> load it instead of collecting (timing.json then records the reuse + the source's
  # collection time). Off by default so Stage-1 wall-clock measurements include the collection.
  reuse_offline: false
  # init_seed_pool: N > 0 -> all Stage-1 episodes reset from N fixed seeds (a small fixed set of initial states, like
  # LIBERO's init states) instead of a new object instance / placement per episode. 0 = off (default). Diagnostic.
  init_seed_pool: 0
  # The state after Cal-QL + warm-up (critic + optimiser, actor, temperature, warm-up transitions, counters) is
  # always saved to offline_cache/<key>/warmup_<hash>/; the hash covers everything it depends on except xi.
  # reuse_warmup: true -> load it and go straight to online RL (timing.json records the source's Cal-QL and
  # warm-up seconds). warmup_cache_actor: keep (identical to an uninterrupted run) | reset (fresh actor+temperature).
  reuse_warmup: false
  warmup_cache_actor: keep
  max_online_env_steps: 400000   # user 2026-11-27: 400k (paper: 250k online steps). Includes the warm-up.
                                 # stored online transitions. This, stop_sr and max_wall_hours
                                 # can be changed during a run: write them to <run dir>/stage1/control.json.
  max_wall_hours: 100
  sr_window: 100                 # Fig. 5 sliding window
  sr_thresholds: [0.8, 0.9, 0.95]
  stop_sr: 2.0                   # > 1 = never stop early: the full max_online_env_steps budget is trained (as the h8*
                                 # runs; the paper trains a fixed budget). 0.95 until 2026-11-27.
  checkpoint_every_episodes: 200
  checkpoint_keep_every_steps: 10000   # (user: keep every 10k) > 0: also keep specialists_step<N>k.pt every N stored env steps (pick the best later)
  final_eval_episodes: 50

stage2:
  num_envs: null                 # optional override of env.num_envs for stage 2 (recording envs use more GPU memory)
  target_successes: 200
  marks: [50, 100, 200]
  residual_deterministic: true   # use mean of pi_delta for expert data
  keep_pure_base: true           # base succeeded before takeover -> still a tau_demo (flagged)

eval:
  episodes: 50
  seed_base: 900000              # fixed eval seed list = seed_base + i (disjoint from training seeds)
  forgetting_tasks: [CloseFridge, OpenDrawer, TurnOnSinkFaucet, PickPlaceCounterToCabinet, TurnOnMicrowave]

seeds:
  offline: 100000
  warmup: 200000
  online: 300000
  stage2: 500000
